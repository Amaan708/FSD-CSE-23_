<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ABES Engineering College - Registration</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #071952, #088395, #35A29F);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #061952, #0B6E99);
            color: white;
            padding: 25px;
            text-align: center;
        }

        .logo {
            width: 80px;
            height: 80px;
            background: white;
            color: #09235c;
            border-radius: 50%;
            margin: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            font-weight: bold;
            border: 4px solid #35A29F;
        }

        .header h1 {
            margin-top: 12px;
            font-size: 30px;
        }

        .header p {
            margin-top: 7px;
            opacity: 0.9;
        }

        /* Form */
        .form-container {
            padding: 35px;
        }

        .section-title {
            color: #09235c;
            font-size: 21px;
            font-weight: bold;
            margin: 20px 0;
            padding-bottom: 8px;
            border-bottom: 2px solid #35A29F;
        }

        .form-row {
            display: flex;
            gap: 20px;
            margin-bottom: 18px;
        }

        .form-group {
            flex: 1;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        label span {
            color: red;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #0B6E99;
            box-shadow: 0 0 6px rgba(11,110,153,0.3);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        /* Gender */
        .gender {
            display: flex;
            gap: 25px;
            padding-top: 10px;
        }

        .gender label {
            font-weight: normal;
        }

        .gender input {
            width: auto;
            margin-right: 5px;
        }

        /* Password */
        .password-strength {
            height: 5px;
            background: #ddd;
            border-radius: 5px;
            margin-top: 7px;
            overflow: hidden;
        }

        #strengthBar {
            height: 100%;
            width: 0%;
            transition: 0.3s;
        }

        .hint {
            font-size: 12px;
            color: #777;
            margin-top: 5px;
        }

        /* Terms */
        .terms {
            margin: 25px 0;
            padding: 15px;
            background: #f4f8fb;
            border-radius: 8px;
        }

        .terms label {
            font-weight: normal;
        }

        .terms input {
            width: auto;
            margin-right: 8px;
        }

        /* Buttons */
        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 25px;
        }

        button {
            border: none;
            padding: 14px 35px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .register {
            background: linear-gradient(135deg, #09235c, #0B6E99);
            color: white;
        }

        .register:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 15px rgba(0,0,0,0.2);
        }

        .reset {
            background: #e5e5e5;
            color: #333;
        }

        .reset:hover {
            background: #ccc;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 18px;
            background: #061952;
            color: white;
            font-size: 13px;
        }

        /* Success Message */
        #successMessage {
            display: none;
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background: #d4edda;
            color: #155724;
            text-align: center;
            font-weight: bold;
        }

        /* Responsive */
        @media(max-width: 700px) {
            .form-row {
                flex-direction: column;
                gap: 15px;
            }

            .form-container {
                padding: 20px;
            }

            .header h1 {
                font-size: 23px;
            }

            .buttons {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- Header -->
    <div class="header">

        <div class="logo">
            ABES
        </div>

        <h1>ABES Engineering College</h1>

        <p>Student Registration Portal</p>

    </div>

    <!-- Form -->
    <div class="form-container">

        <form id="registrationForm">

            <!-- Personal Information -->
            <div class="section-title">
                Personal Information
            </div>

            <div class="form-row">

                <div class="form-group">
                    <label>First Name <span>*</span></label>
                    <input type="text" id="firstName"
                           placeholder="Enter first name"
                           required>
                </div>

                <div class="form-group">
                    <label>Last Name <span>*</span></label>
                    <input type="text" id="lastName"
                           placeholder="Enter last name"
                           required>
                </div>

            </div>

            <div class="form-row">

                <div class="form-group">

                    <label>Date of Birth <span>*</span></label>

                    <input type="date"
                           id="dob"
                           required>

                </div>

                <div class="form-group">

                    <label>Email Address <span>*</span></label>

                    <input type="email"
                           id="email"
                           placeholder="example@gmail.com"
                           required>

                </div>

            </div>

            <div class="form-row">

                <div class="form-group">

                    <label>Mobile Number <span>*</span></label>

                    <input type="tel"
                           id="mobile"
                           placeholder="10 digit mobile number"
                           pattern="[0-9]{10}"
                           maxlength="10"
                           required>

                </div>

                <div class="form-group">

                    <label>Gender <span>*</span></label>

                    <div class="gender">

                        <label>
                            <input type="radio"
                                   name="gender"
                                   value="Male"
                                   required>
                            Male
                        </label>

                        <label>
                            <input type="radio"
                                   name="gender"
                                   value="Female">
                            Female
                        </label>

                        <label>
                            <input type="radio"
                                   name="gender"
                                   value="Other">
                            Other
                        </label>

                    </div>

                </div>

            </div>


            <!-- Academic Information -->

            <div class="section-title">
                Academic Information
            </div>

            <div class="form-row">

                <div class="form-group">

                    <label>Course <span>*</span></label>

                    <select id="course" required>

                        <option value="">
                            -- Select Course --
                        </option>

                        <option>B.Tech Computer Science & Engineering</option>

                        <option>B.Tech Artificial Intelligence</option>

                        <option>B.Tech Information Technology</option>

                        <option>B.Tech Electronics & Communication</option>

                        <option>B.Tech Mechanical Engineering</option>

                        <option>B.Tech Electrical Engineering</option>

                        <option>M.Tech</option>

                        <option>MCA</option>

                    </select>

                </div>

                <div class="form-group">

                    <label>Year <span>*</span></label>

                    <select required>

                        <option value="">
                            -- Select Year --
                        </option>

                        <option>1st Year</option>
                        <option>2nd Year</option>
                        <option>3rd Year</option>
                        <option>4th Year</option>

                    </select>

                </div>

            </div>

            <div class="form-row">

                <div class="form-group">

                    <label>12th Percentage</label>

                    <input type="number"
                           min="0"
                           max="100"
                           step="0.01"
                           placeholder="Enter percentage">

                </div>

                <div class="form-group">

                    <label>JEE Rank / Score</label>

                    <input type="text"
                           placeholder="Enter JEE rank or score">

                </div>

            </div>


            <!-- Address -->

            <div class="section-title">
                Contact & Address
            </div>

            <div class="form-row">

                <div class="form-group">

                    <label>City <span>*</span></label>

                    <input type="text"
                           placeholder="Enter city"
                           required>

                </div>

                <div class="form-group">

                    <label>State <span>*</span></label>

                    <select required>

                        <option value="">
                            -- Select State --
                        </option>

                        <option>Uttar Pradesh</option>
                        <option>Delhi</option>
                        <option>Haryana</option>
                        <option>Rajasthan</option>
                        <option>Maharashtra</option>
                        <option>Bihar</option>
                        <option>Other</option>

                    </select>

                </div>

            </div>

            <div class="form-group">

                <label>Full Address <span>*</span></label>

                <textarea
                    placeholder="Enter your complete address"
                    required></textarea>

            </div>


            <!-- Account -->

            <div class="section-title">
                Account Information
            </div>

            <div class="form-row">

                <div class="form-group">

                    <label>Password <span>*</span></label>

                    <input type="password"
                           id="password"
                           placeholder="Create password"
                           required>

                    <div class="password-strength">
                        <div id="strengthBar"></div>
                    </div>

                    <div class="hint">
                        Use at least 8 characters.
                    </div>

                </div>

                <div class="form-group">

                    <label>Confirm Password <span>*</span></label>

                    <input type="password"
                           id="confirmPassword"
                           placeholder="Confirm password"
                           required>

                </div>

            </div>


            <!-- Terms -->

            <div class="terms">

                <label>

                    <input type="checkbox"
                           id="terms"
                           required>

                    I agree to the ABES Engineering College
                    terms and conditions and confirm that the
                    information provided by me is correct.

                </label>

            </div>


            <!-- Buttons -->

            <div class="buttons">

                <button type="submit"
                        class="register">
                    Register Now
                </button>

                <button type="reset"
                        class="reset">
                    Reset Form
                </button>

            </div>

            <div id="successMessage">
                Registration Successful! Welcome to ABES Engineering College.
            </div>

        </form>

    </div>

    <!-- Footer -->

    <div class="footer">

        © 2026 ABES Engineering College | Student Registration Portal

    </div>

</div>


<script>

    // Password Strength
    const password = document.getElementById("password");
    const strengthBar = document.getElementById("strengthBar");

    password.addEventListener("input", function () {

        let value = password.value;
        let strength = 0;

        if (value.length >= 8)
            strength += 25;

        if (/[A-Z]/.test(value))
            strength += 25;

        if (/[0-9]/.test(value))
            strength += 25;

        if (/[^A-Za-z0-9]/.test(value))
            strength += 25;

        strengthBar.style.width = strength + "%";

    });


    // Form Submit
    document.getElementById("registrationForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();

            let password =
                document.getElementById("password").value;

            let confirmPassword =
                document.getElementById("confirmPassword").value;

            if (password !== confirmPassword) {

                alert("Passwords do not match!");

                return;

            }

            if (password.length < 8) {

                alert("Password must contain at least 8 characters!");

                return;

            }

            document.getElementById("successMessage")
                .style.display = "block";

            document.getElementById("successMessage")
                .innerHTML =
                "✅ Registration Successful! Welcome to ABES Engineering College.";

        });

</script>

</body>
</html>
