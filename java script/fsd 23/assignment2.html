```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bus Booking System</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f172a, #1d4ed8, #38bdf8);
        }

        /* MAIN 600 x 600 BOX */
        .booking-container {
            width: 600px;
            height: 600px;
            background: rgba(255, 255, 255, 0.97);
            border-radius: 25px;
            padding: 18px;
            overflow-y: auto;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        }

        .booking-container::-webkit-scrollbar {
            width: 7px;
        }

        .booking-container::-webkit-scrollbar-thumb {
            background: #2563eb;
            border-radius: 10px;
        }

        /* HEADER */
        .header {
            text-align: center;
            margin-bottom: 15px;
        }

        .bus-logo {
            width: 65px;
            height: 65px;
            margin: auto;
            border-radius: 50%;
            background: linear-gradient(135deg, #2563eb, #06b6d4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            box-shadow: 0 8px 18px rgba(37, 99, 235, 0.35);
        }

        .header h1 {
            margin-top: 7px;
            color: #0f172a;
            font-size: 26px;
        }

        .header p {
            color: #64748b;
            font-size: 12px;
        }

        /* SECTION */
        .section {
            background: #f8fafc;
            border: 1.5px solid #dbeafe;
            border-radius: 15px;
            padding: 12px;
            margin-bottom: 13px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        }

        .section-title {
            font-size: 17px;
            font-weight: 700;
            color: #1d4ed8;
            margin-bottom: 10px;
            border-left: 4px solid #2563eb;
            padding-left: 8px;
        }

        /* INPUTS */
        .input-group {
            margin-bottom: 8px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 4px;
        }

        input,
        select {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background: white;
            font-size: 13px;
            outline: none;
            transition: 0.3s;
        }

        input:focus,
        select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        /* BUS OPTIONS */
        .bus-options {
            display: flex;
            gap: 10px;
        }

        .bus-option {
            flex: 1;
            border: 2px solid #e2e8f0;
            background: white;
            padding: 10px;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
        }

        .bus-option:hover {
            transform: translateY(-2px);
            border-color: #60a5fa;
        }

        .bus-option.selected {
            border-color: #2563eb;
            background: #eff6ff;
        }

        .bus-option label {
            display: flex;
            align-items: center;
            gap: 7px;
            cursor: pointer;
            font-size: 14px;
        }

        .bus-option input[type="radio"] {
            width: auto;
        }

        .bus-details {
            margin-top: 6px;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #64748b;
        }

        .fare {
            font-weight: 700;
            color: #16a34a;
            font-size: 14px;
        }

        /* SEAT SELECTION */
        .seat-area {
            margin-top: 10px;
        }

        .seat-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 7px;
            margin-top: 7px;
        }

        .seat {
            border: 1px solid #cbd5e1;
            padding: 7px;
            text-align: center;
            border-radius: 7px;
            cursor: pointer;
            background: white;
            font-size: 12px;
            transition: 0.2s;
        }

        .seat:hover {
            border-color: #2563eb;
            background: #eff6ff;
        }

        .seat.selected {
            background: #2563eb;
            color: white;
            border-color: #2563eb;
        }

        .seat.booked {
            background: #cbd5e1;
            color: #64748b;
            cursor: not-allowed;
            text-decoration: line-through;
        }

        /* BUY BUTTON */
        .buy-btn {
            width: 100%;
            padding: 11px;
            margin-top: 10px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #2563eb, #0891b2);
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 7px 15px rgba(37, 99, 235, 0.25);
        }

        .buy-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.35);
        }

        /* TOTAL */
        .total-box {
            background: linear-gradient(135deg, #eff6ff, #ecfeff);
            border: 2px solid #60a5fa;
            border-radius: 14px;
            padding: 12px;
            text-align: center;
        }

        .selected-info {
            font-size: 12px;
            color: #64748b;
            margin-bottom: 4px;
        }

        .total-title {
            font-size: 15px;
            font-weight: 700;
            color: #334155;
        }

        #totalPrice {
            margin-top: 3px;
            font-size: 27px;
            font-weight: 800;
            color: #16a34a;
        }

        #message {
            margin-top: 5px;
            font-size: 12px;
            font-weight: 600;
        }

        /* RESPONSIVE */
        @media (max-width: 650px) {
            .booking-container {
                width: 95vw;
                height: 95vh;
            }

            .bus-options {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<div class="booking-container">

    <!-- HEADER -->
    <div class="header">
        <div class="bus-logo">🚌</div>
        <h1>Bus Booking System</h1>
        <p>Fast • Safe • Comfortable Journey</p>
    </div>


    <!-- USER INFORMATION -->
    <div class="section">

        <div class="section-title">
            👤 User Information
        </div>

        <div class="input-group">
            <label>User Name</label>
            <input
                type="text"
                id="username"
                placeholder="Enter your name"
            >
        </div>

        <div class="input-group">
            <label>User Age</label>
            <input
                type="number"
                id="age"
                min="1"
                max="100"
                placeholder="Enter your age"
            >
        </div>

        <div class="input-group">
            <label>Aadhaar Number</label>
            <input
                type="text"
                id="aadhaar"
                maxlength="12"
                placeholder="Enter 12-digit Aadhaar number"
            >
        </div>

        <div class="input-group">
            <label>Starting City</label>
            <select id="city">
                <option value="">-- Select City --</option>
                <option>Delhi</option>
                <option>Mumbai</option>
                <option>Bangalore</option>
                <option>Goa</option>
            </select>
        </div>

        <div class="input-group">
            <label>Journey Date</label>
            <input type="date" id="journeyDate">
        </div>

    </div>


    <!-- BUS INFORMATION -->
    <div class="section">

        <div class="section-title">
            🚌 Bus Information
        </div>

        <div class="bus-options">

            <!-- AC -->
            <div
                class="bus-option"
                id="acCard"
                onclick="selectBus('AC', 2000)"
            >
                <label>
                    <input
                        type="radio"
                        name="busType"
                        id="acBus"
                    >
                    ❄️ AC Bus
                </label>

                <div class="bus-details">
                    <span>Comfortable AC</span>
                    <span class="fare">₹2000</span>
                </div>
            </div>


            <!-- NON AC -->
            <div
                class="bus-option"
                id="nonAcCard"
                onclick="selectBus('Non-AC', 1500)"
            >
                <label>
                    <input
                        type="radio"
                        name="busType"
                        id="nonAcBus"
                    >
                    🌬️ Non-AC Bus
                </label>

                <div class="bus-details">
                    <span>Normal Bus</span>
                    <span class="fare">₹1500</span>
                </div>
            </div>

        </div>


        <!-- DESTINATION -->
        <div class="input-group" style="margin-top: 10px;">
            <label>Select Destination</label>

            <select id="destination">
                <option value="">-- Select Destination --</option>
                <option>Delhi</option>
                <option>Mumbai</option>
                <option>Bangalore</option>
                <option>Goa</option>
            </select>
        </div>


        <!-- NUMBER OF SEATS -->
        <div class="input-group">

            <label>Number of Seats</label>

            <select
                id="seatCount"
                onchange="selectNumberOfSeats()"
            >
                <option value="0">
                    -- Select Seats --
                </option>

                <option value="1">1 Seat</option>
                <option value="2">2 Seats</option>
                <option value="3">3 Seats</option>
                <option value="4">4 Seats</option>
                <option value="5">5 Seats</option>
                <option value="6">6 Seats</option>
            </select>

        </div>


        <!-- SEAT GRID -->
        <div class="seat-area">

            <label>Select Your Seats</label>

            <div class="seat-grid">

                <div class="seat" onclick="selectSeat(this)">A1</div>
                <div class="seat" onclick="selectSeat(this)">A2</div>
                <div class="seat" onclick="selectSeat(this)">A3</div>
                <div class="seat booked">A4</div>

                <div class="seat" onclick="selectSeat(this)">B1</div>
                <div class="seat" onclick="selectSeat(this)">B2</div>
                <div class="seat booked">B3</div>
                <div class="seat" onclick="selectSeat(this)">B4</div>

                <div class="seat" onclick="selectSeat(this)">C1</div>
                <div class="seat" onclick="selectSeat(this)">C2</div>
                <div class="seat" onclick="selectSeat(this)">C3</div>
                <div class="seat booked">C4</div>

            </div>

        </div>


        <!-- BUY NOW -->
        <button class="buy-btn" onclick="bookTicket()">
            🎫 BUY NOW
        </button>

    </div>


    <!-- TOTAL PRICE -->
    <div class="total-box">

        <div class="selected-info" id="selectedInfo">
            0 seats selected
        </div>

        <div class="total-title">
            💰 Total Ticket Price
        </div>

        <div id="totalPrice">
            ₹0
        </div>

        <div id="message"></div>

    </div>

</div>


<script>

    let busFare = 0;
    let busName = "";
    let selectedSeats = [];


    // SELECT BUS
    function selectBus(name, fare) {

        busName = name;
        busFare = fare;

        document.getElementById("acCard")
            .classList.remove("selected");

        document.getElementById("nonAcCard")
            .classList.remove("selected");

        if (name === "AC") {

            document.getElementById("acBus").checked = true;

            document.getElementById("acCard")
                .classList.add("selected");

        } else {

            document.getElementById("nonAcBus").checked = true;

            document.getElementById("nonAcCard")
                .classList.add("selected");
        }

        calculatePrice();
    }


    // SELECT NUMBER OF SEATS
    function selectNumberOfSeats() {

        let requiredSeats =
            Number(document.getElementById("seatCount").value);

        // Remove excess selected seats
        while (selectedSeats.length > requiredSeats) {

            let seatName =
                selectedSeats.pop();

            let seatElements =
                document.querySelectorAll(".seat");

            seatElements.forEach(function(seat) {

                if (seat.innerText === seatName) {
                    seat.classList.remove("selected");
                }

            });
        }

        updateSelectedInfo();
        calculatePrice();
    }


    // SELECT INDIVIDUAL SEAT
    function selectSeat(seat) {

        if (seat.classList.contains("booked")) {
            return;
        }

        let maxSeats =
            Number(document.getElementById("seatCount").value);

        if (maxSeats === 0) {

            alert("First select the number of seats.");
            return;
        }


        let seatName = seat.innerText;


        // Deselect seat
        if (seat.classList.contains("selected")) {

            seat.classList.remove("selected");

            selectedSeats =
                selectedSeats.filter(
                    function(s) {
                        return s !== seatName;
                    }
                );

        }

        // Select seat
        else {

            if (selectedSeats.length >= maxSeats) {

                alert(
                    "You selected " +
                    maxSeats +
                    " seat(s)."
                );

                return;
            }

            seat.classList.add("selected");
            selectedSeats.push(seatName);
        }


        updateSelectedInfo();
        calculatePrice();
    }


    // UPDATE SEAT INFORMATION
    function updateSelectedInfo() {

        let count = selectedSeats.length;

        document.getElementById(
            "selectedInfo"
        ).innerText =
            count + " seat(s) selected" +
            (count > 0
                ? " : " + selectedSeats.join(", ")
                : "");
    }


    // CALCULATE TOTAL PRICE
    function calculatePrice() {

        let count =
            selectedSeats.length;

        let total =
            busFare * count;

        document.getElementById(
            "totalPrice"
        ).innerText =
            "₹" + total.toLocaleString("en-IN");
    }


    // BOOK TICKET
    function bookTicket() {

        let username =
            document.getElementById("username")
                .value.trim();

        let age =
            document.getElementById("age")
                .value;

        let aadhaar =
            document.getElementById("aadhaar")
                .value.trim();

        let city =
            document.getElementById("city")
                .value;

        let destination =
            document.getElementById("destination")
                .value;

        let journeyDate =
            document.getElementById("journeyDate")
                .value;

        let seatCount =
            Number(
                document.getElementById("seatCount")
                    .value
            );


        // VALIDATION

        if (username === "") {
            alert("Please enter your name.");
            return;
        }

        if (age === "") {
            alert("Please enter your age.");
            return;
        }

        if (aadhaar.length !== 12 || isNaN(aadhaar)) {
            alert("Please enter a valid 12-digit Aadhaar number.");
            return;
        }

        if (city === "") {
            alert("Please select your starting city.");
            return;
        }

        if (destination === "") {
            alert("Please select your destination.");
            return;
        }

        if (city === destination) {
            alert(
                "Starting city and destination cannot be the same."
            );
            return;
        }

        if (journeyDate === "") {
            alert("Please select journey date.");
            return;
        }

        if (busFare === 0) {
            alert("Please select AC or Non-AC bus.");
            return;
        }

        if (seatCount === 0) {
            alert("Please select number of seats.");
            return;
        }

        if (selectedSeats.length !== seatCount) {
            alert(
                "Please select exactly " +
                seatCount +
                " seat(s)."
            );
            return;
        }


        // TOTAL
        let total =
            busFare * selectedSeats.length;


        // SUCCESS
        document.getElementById("message").innerHTML =
            "✅ Booking Successful!";

        alert(
            "🎫 BUS BOOKING CONFIRMED\n\n" +
            "Name: " + username +
            "\nFrom: " + city +
            "\nTo: " + destination +
            "\nDate: " + journeyDate +
            "\nBus: " + busName +
            "\nSeats: " + selectedSeats.join(", ") +
            "\nTotal Fare: ₹" +
            total.toLocaleString("en-IN")
        );
    }

</script>

</body>
</html>
```
